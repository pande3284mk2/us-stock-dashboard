name: Daily Baseline Commentary Update

# PCが閉じていてClaudeによる手動更新が行われなかった日でも、commentary.jsonが
# 最低限は毎日自動更新されるようにするためのワークフロー。
# GitHub Actions組み込みのGITHUB_TOKEN（追加のシークレット登録は不要）を使い、
# リポジトリへcommentary.jsonをコミット・プッシュする。

on:
  schedule:
    # 毎日 UTC 22:00 = JST 翌7:00 頃に実行（Claudeによる朝8時台の詳細更新より少し前を狙う）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-baseline-commentary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Generate baseline commentary (skips if Claude already updated today)
        run: python scripts/generate_baseline_commentary.py

      - name: Commit and push if commentary.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commentary.json
          if git diff --cached --quiet; then
            echo "No changes to commentary.json; nothing to commit."
          else
            git commit -m "Auto-update commentary.json (baseline, github-actions)"
            git push
          fi
