name: Portfolio Summary Email

# ポートフォリオ（保有株）の定時サマリーメールワークフロー（手動テスト用）。
#
# ［2026-08-13 変更］ このワークフローの自動実行（schedule）は無効化しました。
# 現在は .github/workflows/portfolio_loop.yml（自己ループ式ワークフロー）が
# アラート判定・定時サマリーの両方を一本化して担当しています。
# このファイルは、手動実行（workflow_dispatch）による動作確認・デバッグ用として
# 残してあります。もし自己ループ式ワークフローが利用規約上の問題などで使えなく
# なった場合は、下のscheduleコメントを元に戻すことで、このワークフロー単体での
# 運用（実行間隔は数時間に1回程度）に戻せます。
#
# 復活させる場合は on: の下に以下を追加してください:
#   schedule:
#     - cron: "*/30 * * * *"

on:
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance

      - name: Send portfolio summary email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/portfolio_email_alert.py summary
