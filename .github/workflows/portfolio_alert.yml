name: Portfolio Email Alert

# ポートフォリオ（保有株）の時間外・プレマーケットの値動きを、5分おきに
# チェックしてメールでお知らせするワークフロー（アラート判定専用）。
# GitHub Actions（GitHubが無料で提供している「決まった時刻に自動でプログラムを
# 実行してくれる仕組み」）を使い、PCやアプリを閉じていても実行される。
#
# ［2026-08-11 追記］以前はこのワークフロー1つで「アラート判定」と「毎時30分の
# 定時サマリー」の両方を担っていましたが、5分間隔の高頻度スケジュールは実際には
# GitHub側で大幅に間引かれてしまい、結果として定時サマリーがほとんど届かない
# 状態になっていました。そこで、定時サマリーは別ワークフロー
# （.github/workflows/portfolio_summary.yml、30分間隔）に分離し、
# このワークフローはアラート判定のみを担当します。
#
# 通知のルール（scripts/portfolio_email_alert.py alert 側で判定）:
#   ・5分ごと（毎時2,7,12,17,22,27,32,37,42,47,52,57分）の実行のたび、
#     「前回チェック（5分前）の価格」からの変化率が±3%以上なら、その場で
#     アラートメールを送る（前日終値ではなく、直近の5分前比較）。
#   ・値動きが無ければメールは送らない（毎回必ず送るのは定時サマリー側の役目）。
#
# 「前回チェック時の価格」は data/last_check_prices.json に保存し、実行の
# 最後にこのワークフローがリポジトリへコミットし直す（このためリポジトリへの
# 書き込み権限 contents: write が必要）。
#
# 毎時0分ちょうどはGitHub Actions全体で実行が混雑し、スケジュール実行が
# 遅延しやすいとGitHub公式ドキュメントに記載されているため、
# 実行タイミングを毎時2,7,12,17,22,27,32,37,42,47,52,57分にずらしている。

on:
  schedule:
    # 5分おき・毎時0分ジャストを避けて2分オフセット（UTC基準）
    - cron: "2-59/5 * * * *"
  # GitHubの「Actions」画面から手動で今すぐ実行したい時のためのボタンも用意しておく。
  workflow_dispatch:

permissions:
  contents: write

# 5分間隔の実行が万一重なった場合に、data/last_check_prices.json への
# 書き込みが衝突しないよう、同時には1つの実行だけが動くようにする
# （前の実行が終わるまで次の実行は待たされる。取りこぼしにはならない）。
concurrency:
  group: portfolio-alert
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance

      - name: Run alert check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/portfolio_email_alert.py alert

      - name: Commit updated last-check prices
        # data/last_check_prices.json が変化していればコミットし直す。
        # このファイルは次回5分後の実行が「前回価格」として読み込む。
        run: |
          if [ -n "$(git status --porcelain data/last_check_prices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/last_check_prices.json
            git commit -m "Update last-check prices"
            git push
          else
            echo "変更なし。コミットは行いません。"
          fi
