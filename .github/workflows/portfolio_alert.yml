name: Portfolio Email Alert

# ポートフォリオ（保有株）のアラート判定ワークフロー（手動テスト用）。
#
# ［2026-08-13 変更］ このワークフローの自動実行（schedule）は無効化しました。
# 現在は .github/workflows/portfolio_loop.yml（自己ループ式ワークフロー）が
# アラート判定・定時サマリーの両方を一本化して担当しています。
# このファイルは、手動実行（workflow_dispatch）による動作確認・デバッグ用として
# 残してあります。もし自己ループ式ワークフローが利用規約上の問題などで使えなく
# なった場合は、下のscheduleコメントを元に戻すことで、このワークフロー単体での
# 運用（実行間隔は数時間に1回程度）に戻せます。
#
# 復活させる場合は on: の下に以下を追加してください:
#   schedule:
#     - cron: "2-59/5 * * * *"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-alert
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance

      - name: Run alert check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/portfolio_email_alert.py alert

      - name: Commit updated last-check prices
        run: |
          if [ -n "$(git status --porcelain data/last_check_prices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/last_check_prices.json
            git commit -m "Update last-check prices"
            git push
          else
            echo "変更なし。コミットは行いません。"
          fi
